# Prod-shaped template — mirrors the live `ddi-api` stack.
#
# Prerequisites for `docker compose up`:
#   - A `xenforo` stack is already running (provides `xenforo-db` on
#     the `xenforo_internal` network).
#   - The external networks exist:
#       docker network create edge
#       docker network create xenforo_internal

services:
  api:
    build:
      dockerfile: "Dockerfile"
      context: "./"
    image: ddi/api:latest
    container_name: ddi-api
    labels:
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - edge
      - xenforo_internal
    restart: always
    # Single public listener (#134/#135). The old gRPC port (:10000) and its
    # PORT dial-target env are gone with the gateway.
    ports:
      - "11000:11000"
    environment:
      DB_USERNAME: xenforo
      DB_PASSWORD:
      DB_HOST: xenforo-db
      DB_PORT: 3306
      # Required — DDI root URL for rank, award, and uniform images.
      # In local dev the API falls back to the legacy https://7cav.us host if unset.
      # ASSET_BASE_URL: ${ASSET_BASE_URL:?ASSET_BASE_URL must be set to a DDI asset host}
      # Optional — JSON map of roster id -> wire name; defaults to the 7CAV roster taxonomy.
      # ORG_ROSTER_NAMES: '{"1":"ROSTER_TYPE_ACTIVE","2":"ROSTER_TYPE_RESERVE"}'
      # Optional — JSON map of position group title -> AOR; defaults to the 7CAV AOR map.
      # ORG_POSITION_GROUP_AOR: '{"Regimental HQ":"HHQ","New Recruits":"RTC"}'
      # Optional — JSON map of substring -> AOR for AOR matching; defaults to {"Command":"HHQ"}.
      # ORG_AOR_SUBSTRINGS: '{"Command":"HHQ"}'
      # Optional — comma-separated roster ids for AWOL eligibility; defaults to 1,2.
      # ORG_AWOL_ACTIVE_ROSTERS: "1,2"
      # Optional — JSON map of rank id -> short abbreviation; defaults to the 7CAV rank table.
      # RANK_SHORT_NAMES: '{"1":"GOA","6":"COL"}'
      # Optional — JSON map of record_type_id -> wire name; defaults to the 7CAV record table.
      # RECORD_TYPE_NAMES: '{"1":"RECORD_TYPE_PROMOTION","2":"RECORD_TYPE_OPERATION"}'
      # Optional — comma-separated record type ids that trigger S1 uniform recalculation; defaults to 1,6,7,8,9.
      # UNIFORM_TRIGGER_RECORD_TYPES: "1,6,7,8,9"
      # Optional — populates Ticket.forum_url; empty if unset.
      # FORUM_BASE_URL: https://forums.ddi.example
      # Optional — refresh interval for the in-memory ticket reference cache; defaults to 15m.
      # REFERENCE_CACHE_REFRESH_INTERVAL: 15m
      # Optional — enables errors-only Sentry capture (#118). The DSN lives only
      # in the prod host's compose config (#113); unset anywhere else = no-op.
      # SENTRY_DSN:
      # Optional — verbose Sentry SDK diagnostics (one log line per event sent;
      # send failures/drops/rate limits become visible). For debugging delivery
      # problems without a rebuild; leave unset normally.
      # SENTRY_DEBUG: "true"

networks:
  edge:
    external: true
    name: edge
  xenforo_internal:
    external: true
    name: xenforo_internal
